<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniEval report</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #f6f7f8;
  --text: #1f2328;
  --muted: #5f6368;
  --border: #e3e5e8;
  --accent: #2563eb;
  --good: #15803d;
  --bad: #b91c1c;
  --warn: #b45309;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
  --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --c1: #2563eb;
  --c2: #059669;
  --c3: #d97706;
  --c4: #7c3aed;
  --c5: #db2777;
  --c6: #0891b2;
  --c7: #64748b;
  --c8: #65a30d;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317;
    --surface: #181c22;
    --text: #e6e8ea;
    --muted: #9aa1ab;
    --border: #2a2f37;
    --accent: #60a5fa;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --c1: #60a5fa;
    --c2: #34d399;
    --c3: #fbbf24;
    --c4: #a78bfa;
    --c5: #f472b6;
    --c6: #22d3ee;
    --c7: #94a3b8;
    --c8: #a3e635;
  }
}

:root[data-theme="dark"] {
  --bg: #101317;
  --surface: #181c22;
  --text: #e6e8ea;
  --muted: #9aa1ab;
  --border: #2a2f37;
  --accent: #60a5fa;
  --good: #4ade80;
  --bad: #f87171;
  --warn: #fbbf24;
  --c1: #60a5fa;
  --c2: #34d399;
  --c3: #fbbf24;
  --c4: #a78bfa;
  --c5: #f472b6;
  --c6: #22d3ee;
  --c7: #94a3b8;
  --c8: #a3e635;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
}

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 20px 64px;
}

.topbar {
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand {
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text);
  text-decoration: none;
}

.section-nav {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  flex: 1;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
}

.section-nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 4px;
}

.section-nav a:hover,
.section-nav a:focus-visible {
  color: var(--text);
  background: var(--surface);
}

.theme-toggle {
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 12px;
  cursor: pointer;
  flex-shrink: 0;
}

.theme-toggle:hover {
  color: var(--text);
  border-color: var(--muted);
}

section {
  margin-top: 48px;
  scroll-margin-top: 64px;
}

h2 {
  font-size: 19px;
  font-weight: 600;
  margin: 0 0 4px;
}

.section-note {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 16px;
}

h3 {
  font-size: 15px;
  font-weight: 600;
  margin: 28px 0 10px;
}

code,
.mono {
  font-family: var(--mono);
  font-size: 0.92em;
}

dl.facts {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 6px 24px;
  margin: 0;
}

dl.facts dt {
  color: var(--muted);
  font-size: 13px;
  align-self: baseline;
}

dl.facts dd {
  margin: 0;
  font-family: var(--mono);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.table-scroll {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13.5px;
}

th,
td {
  text-align: left;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

th {
  color: var(--muted);
  font-weight: 500;
  font-size: 12.5px;
  white-space: nowrap;
}

th button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

th button:hover {
  color: var(--text);
}

th .sort-arrow {
  display: inline-block;
  width: 1em;
}

td.num,
th.num {
  text-align: right;
  font-family: var(--mono);
  white-space: nowrap;
}

td.na {
  color: var(--muted);
}

.status-ok {
  color: var(--good);
}

.status-failed {
  color: var(--bad);
}

.eval-pass {
  color: var(--good);
}

.eval-fail {
  color: var(--bad);
}

.eval-na {
  color: var(--muted);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.toolbar label {
  color: var(--muted);
  font-size: 12.5px;
}

input[type="text"],
select {
  font: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 8px;
}

input[type="text"]:focus-visible,
select:focus-visible,
button:focus-visible,
a:focus-visible,
[tabindex="0"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

input[type="checkbox"] {
  accent-color: var(--accent);
}

fieldset {
  border: none;
  padding: 0;
  margin: 0;
}

legend {
  color: var(--muted);
  font-size: 12.5px;
  padding: 0;
  margin-bottom: 6px;
}

.radio-row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 14px;
  font-size: 13.5px;
}

.radio-row label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.chart-rows {
  display: grid;
  gap: 8px;
}

.chart-row {
  display: grid;
  grid-template-columns: 170px 1fr max-content;
  gap: 12px;
  align-items: center;
}

.chart-row .row-label {
  font-family: var(--mono);
  font-size: 12.5px;
  overflow-wrap: anywhere;
}

.chart-row .row-value {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
}

.track {
  background: var(--surface);
  border-radius: 3px;
  height: 16px;
  display: flex;
  overflow: hidden;
}

.track .fill {
  height: 100%;
}

.track .fill.partial {
  background-image: repeating-linear-gradient(
    45deg,
    transparent 0,
    transparent 5px,
    rgba(127, 127, 127, 0.35) 5px,
    rgba(127, 127, 127, 0.35) 7px
  );
}

.segment {
  height: 100%;
  min-width: 1px;
}

.bar-note {
  font-size: 11.5px;
  color: var(--warn);
  font-family: var(--mono);
}

.histogram {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 110px;
  margin: 8px 0 4px;
}

.histogram .bin {
  flex: 1;
  background: var(--c1);
  border-radius: 2px 2px 0 0;
  min-height: 1px;
}

.histogram .bin:hover,
.histogram .bin:focus-visible {
  background: var(--accent);
}

.histogram-axis {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11.5px;
  font-family: var(--mono);
}

.multi-chart {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 14px;
}

.multi-chart h4 {
  margin: 0 0 4px;
  font-size: 13.5px;
  font-family: var(--mono);
  font-weight: 600;
}

.multi-chart .sub {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 8px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin: 10px 0 0;
  font-size: 12.5px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

details.data-details {
  margin-top: 12px;
  font-size: 13px;
}

details.data-details summary {
  color: var(--muted);
  cursor: pointer;
}

details.data-details table {
  margin-top: 8px;
}

.warning-box {
  border-left: 3px solid var(--warn);
  background: var(--surface);
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 13.5px;
}

.warning-box ul {
  margin: 6px 0 0;
  padding-left: 20px;
}

.empty-note {
  color: var(--muted);
  font-size: 13.5px;
  padding: 12px 0;
}

.trial-detail {
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 12px 0;
  padding: 14px 16px;
}

.trial-detail header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 8px;
}

.trial-detail header h4 {
  font-family: var(--mono);
  font-size: 13.5px;
  margin: 0;
  overflow-wrap: anywhere;
}

.trial-detail pre {
  background: var(--surface);
  border-radius: 4px;
  padding: 10px 12px;
  margin: 6px 0 0;
  font-family: var(--mono);
  font-size: 12.5px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 300px;
  overflow-y: auto;
}

.trial-detail .field-label {
  color: var(--muted);
  font-size: 12px;
  margin-top: 12px;
}

.pagination {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted);
}

.pagination button {
  font: inherit;
  font-size: 13px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 4px;
  padding: 4px 12px;
  cursor: pointer;
}

.pagination button:disabled {
  opacity: 0.45;
  cursor: default;
}

.result-count {
  color: var(--muted);
  font-size: 12.5px;
  margin-left: auto;
}

.delta-up {
  color: var(--good);
}

.delta-down {
  color: var(--bad);
}

.delta-na {
  color: var(--muted);
}

.pair-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.pair-grid pre {
  background: var(--surface);
  border-radius: 4px;
  padding: 10px 12px;
  margin: 4px 0 0;
  font-family: var(--mono);
  font-size: 12.5px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 220px;
  overflow-y: auto;
}

.pair-grid .sub {
  color: var(--muted);
  font-size: 12px;
  margin: 0;
}

.judgment-list {
  margin: 10px 0 0;
  padding-left: 20px;
  font-size: 13px;
}

.criteria-table td.mono {
  white-space: nowrap;
}

.score-bar-note {
  color: var(--muted);
  font-size: 12px;
}

@media (max-width: 720px) {
  .pair-grid {
    grid-template-columns: 1fr;
  }
}

.diff-cell {
  background: var(--surface);
}

@media (max-width: 720px) {
  .chart-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .chart-row .row-value {
    justify-self: end;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .toolbar input[type="text"],
  .toolbar select {
    width: 100%;
  }

  dl.facts {
    grid-template-columns: 1fr;
    gap: 2px;
  }

  dl.facts dd {
    margin-bottom: 8px;
  }
}

</style>
</head>

const LATENCY_BINS = 20;

function renderLatency(section) {
  const selected = new Map(stats.map((item) => [item.model, true]));

  const charts = h("div");
  const checkboxArea = h("fieldset");

  function draw() {

      class: "section-note",
      text: legacyLatencyRun
        ? `Histograms use ${LATENCY_BINS} equal-width bins over the successful requests of each model. This run predates 0.3.1: latency mixes generation and evaluation; queue delay is reported separately.`
        : `Histograms use ${LATENCY_BINS} equal-width bins over the successful requests of each model. Latency measures the model call (generation) only; evaluation and queue delays are reported separately.`,
    }),
    charts,
  );
  draw();
}

function latencyBlock(item) {
  const values = trials
    .filter((trial) => trial.model === item.model && trial.ok)
    .map((trial) => generationLatency(trial))
    .filter((value) => value !== null);
  const block = h("div", { class: "multi-chart" },
    h("h4", { text: item.model }),
    h("p", { class: "sub", text: `${values.length} successful requests` }),
  );
  if (values.length === 0) {
    block.append(h("p", { class: "empty-note", text: "No successful requests: no latency data." }));
    return block;
  }
  const histogram = buildHistogram(values, LATENCY_BINS);
  const maxCount = Math.max(...histogram.bins);
  const bars = histogram.bins.map((count, index) => {
    const start = histogram.min + (index * histogram.width);
    const end = start + histogram.width;
    return h("div", {
      class: "bin",
      tabindex: "0",
      style: `height:${Math.max(1, (count / maxCount) * 100)}%`,
      title: `[${start.toFixed(1)}, ${end.toFixed(1)}) ms: ${count} requests`,
      "aria-label": `Bin ${index + 1}: ${count} requests between ${start.toFixed(1)} and ${end.toFixed(1)} milliseconds`,
    });
  });
  block.append(
    h("div", { class: "histogram", role: "img", "aria-label": ariaForHistogram(item.model, histogram) }, bars),
    h("div", { class: "histogram-axis" },
      h("span", { text: histogram.min.toFixed(1) + " ms" }),
      h("span", { text: "median " + fmtMs(item.median_latency_ms) + " ms" }),
      h("span", { text: "p95 " + fmtMs(item.p95_latency_ms) + " ms" }),
      h("span", { text: histogram.max.toFixed(1) + " ms" }),
    ),
    h("p", {
      class: "sub",
      text: legacyLatencyRun
        ? "Legacy run: generation and evaluation latencies are not separated."
        : `evaluation median ${fmtMs(item.median_evaluation_ms)} ms · total median ${fmtMs(item.median_total_ms)} ms`,
    }),
    h("details", { class: "data-details" },
      h("summary", { text: "View bin counts" }),
      h("div", { class: "table-scroll" },
        h("table", null,
          h("thead", null,
            h("tr", null,
              h("th", { text: "Range (ms)" }),
              h("th", { class: "num", text: "Requests" }),
            ),
          ),
          h("tbody", null,
            histogram.bins.map((count, index) => {
              const start = histogram.min + index * histogram.width;
              const end = start + histogram.width;
              return h("tr", null,
                h("td", { class: "mono", text: `[${start.toFixed(1)}, ${end.toFixed(1)})` }),
                h("td", { class: "num", text: String(count) }),
              );
            }),
          ),
        ),
      ),
    ),
  );
  return block;
}

function ariaForHistogram(model, histogram) {
  const total = histogram.bins.reduce((sum, count) => sum + count, 0);
  return `Latency distribution for ${model}: ${total} requests between ` +
    `${histogram.min.toFixed(1)} and ${histogram.max.toFixed(1)} milliseconds in ${LATENCY_BINS} bins.`;
}

function buildHistogram(values, binCount) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const width = (max - min) / binCount || 1;
  const bins = Array.from({ length: binCount }, () => 0);
  for (const value of values) {
    let index = Math.floor((value - min) / width);
    if (index >= binCount) index = binCount - 1;
    bins[index] += 1;
  }
  return { bins, min, max, width };
}

function renderTokensCost(section) {
  section.append(
    h("h3", { text: "Token consumption" }),
    tokenChart(),
    h("p", {
      class: "section-note",
      text: "Bars stack input and output tokens over the successful requests that reported usage. Partial coverage is marked explicitly.",
    }),
    h("h3", { text: "Estimated cost" }),
    costChart(),
    h("p", {
      class: "section-note",
      text: "Hatched bars mark partially known costs; n/a means no pricing data was available. Models are not ranked by cost when data is missing.",
    }),
  );
}

function coverageNote(reported, succeeded) {
  if (reported === null || reported === undefined) return "coverage unknown";
  if (reported === succeeded) return null;
  return `${reported}/${succeeded} requests`;
}

function tokenChart() {
  const withData = stats.filter(
    (item) => item.input_tokens !== null || item.output_tokens !== null,
  );
  if (withData.length === 0) {
    return h("p", { class: "empty-note", text: "No token usage was reported in this run." });
  }
  const totals = withData.map(
    (item) => (item.input_tokens || 0) + (item.output_tokens || 0),
  );
  const maxTotal = Math.max(...totals);
  return h("div", { class: "chart-rows" },
    h("div", { class: "legend" },
      h("span", { class: "legend-item" },
        h("span", { class: "legend-swatch", style: "background:var(--c1)" }), "Input"),
      h("span", { class: "legend-item" },
        h("span", { class: "legend-swatch", style: "background:var(--c2)" }), "Output"),
    ),
    withData.map((item) => {
      const input = item.input_tokens || 0;
      const output = item.output_tokens || 0;
      const note = coverageNote(item.input_tokens_reported, item.succeeded);
      return h("div", { class: "chart-row" },
        h("span", { class: "row-label", text: item.model }),
        h("div", { class: "track", role: "img", "aria-label": ariaForTokens(item) },
          h("div", { class: "segment", style: `width:${(input / maxTotal) * 100}%;background:var(--c1)`, title: `Input: ${fmtInt(item.input_tokens)}` }),
          h("div", { class: "segment", style: `width:${(output / maxTotal) * 100}%;background:var(--c2)`, title: `Output: ${fmtInt(item.output_tokens)}` }),
        ),
        h("span", { class: "row-value" },
          `${fmtInt(item.input_tokens)} in / ${fmtInt(item.output_tokens)} out`,
          note ? h("span", { class: "bar-note", text: ` (${note})` }) : null,
        ),
      );
    }),
  );
}

function ariaForTokens(item) {
  return `${item.model}: ${fmtInt(item.input_tokens)} input tokens, ${fmtInt(item.output_tokens)} output tokens` +
    (coverageNote(item.input_tokens_reported, item.succeeded)
      ? `, coverage ${coverageNote(item.input_tokens_reported, item.succeeded)}`
      : ", full coverage");
}

function costChart() {
  const ranked = [...stats].sort((a, b) => costRank(b) - costRank(a));
  return h("div", { class: "chart-rows" },
    h("div", { class: "legend" },
      h("span", { class: "legend-item" },
        h("span", { class: "legend-swatch", style: "background:var(--c1)" }), "Known cost"),
      h("span", { class: "legend-item" },
        h("span", { class: "legend-swatch", style: "background:repeating-linear-gradient(45deg,var(--c1) 0 4px,transparent 4px 8px)" }),
        "Partially known"),
    ),
    ranked.map((item) => {
      const full = item.cost_reported === item.succeeded;
      const note = coverageNote(item.cost_reported, item.succeeded);
      const maxCost = Math.max(...stats.map((other) => other.cost_usd || 0));
      const known = item.cost_usd !== null && item.cost_usd !== undefined;
      return h("div", { class: "chart-row" },
        h("span", { class: "row-label", text: item.model }),
        h("div", { class: "track", role: "img", "aria-label": ariaForCost(item) },
          known && maxCost > 0
            ? h("div", {
                class: "fill" + (full ? "" : " partial"),
                style: `width:${Math.max(0.5, ((item.cost_usd || 0) / maxCost) * 100)}%;background:var(--c1)`,
              })
            : null,
        ),
        h("span", { class: "row-value" },
          fmtCost(item.cost_usd) + (item.cost_usd === 0 && full ? " (measured zero)" : ""),
          known && !full && note ? h("span", { class: "bar-note", text: ` (${note}, partial)` }) : null,
        ),
      );
    }),
  );
}

function costRank(item) {
  if (item.cost_usd === null || item.cost_usd === undefined) return -1;
  const full = item.cost_reported === item.succeeded;
  return (full ? 1 : 0) * 1e12 + item.cost_usd;
}

function ariaForCost(item) {
  if (item.cost_usd === null || item.cost_usd === undefined) return `${item.model}: cost unknown`;
  const note = coverageNote(item.cost_reported, item.succeeded);
  return `${item.model}: estimated cost ${fmtCost(item.cost_usd)} USD` + (note ? `, ${note}` : ", full coverage");
}

const OUTCOME_FILTERS = [
  ["all", "All outcomes"],
  ["correct", "Correct answers"],
  ["incorrect", "Incorrect answers"],
  ["failed", "Failed requests"],
  ["not-evaluable", "Not evaluable"],
];

const TRIAL_COLUMNS = [
  ["model", "Model", true],
  ["entryId", "Entry", true],
  ["repeat", "Rep", true],
  ["status", "Status", false],
  ["evaluation", "Eval", false],
  ["latencyMs", "Gen (ms)", true],
  ["evaluationMs", "Eval (ms)", true],
  ["totalMs", "Total (ms)", true],
  ["queueMs", "Queue (ms)", true],
  ["inputTokens", "In tok", true],
  ["outputTokens", "Out tok", true],
  ["costUsd", "Cost (USD)", true],
  ["errorType", "Error", false],
];

const explorer = {
  search: "",
  model: "all",
  outcome: "all",
  errorType: "all",
  sortKey: null,
  sortAsc: true,
  page: 1,
  pageSize: 25,
};

function trialOutcome(trial) {
  if (!trial.ok) return "failed";
  if (trial.passed === true) return "correct";
  if (trial.passed === false) return "incorrect";
  return "not-evaluable";
}

function trialMatches(trial) {
  if (explorer.model !== "all" && trial.model !== explorer.model) return false;
  if (explorer.outcome !== "all" && trialOutcome(trial) !== explorer.outcome) return false;
  if (explorer.errorType !== "all" && trial.errorType !== explorer.errorType) return false;
  if (explorer.search) {
    const needle = explorer.search.toLowerCase();
    const haystack = `${trial.entryId} ${trial.response || ""} ${trial.errorMessage || ""}`.toLowerCase();
    if (!haystack.includes(needle)) return false;
  }
  return true;
}

function trialSortValue(trial) {
  const key = explorer.sortKey;
  if (!key) return null;
  if (key === "model") return trial.model;
  if (key === "entryId") return trial.entryId;
  return trial[key];
}

function compareTrials(a, b) {
  const aValue = trialSortValue(a);
  const bValue = trialSortValue(b);
  if (aValue === null && bValue === null) return 0;
  if (aValue === null) return 1;
  if (bValue === null) return -1;
  const order = typeof aValue === "string"
    ? aValue.localeCompare(bValue)
    : aValue - bValue;
  return explorer.sortAsc ? order : -order;
}

function renderTrials(section) {
  if (trials.length === 0) {
    section.append(h("p", { class: "empty-note", text: "No trial data is present in this export." }));
    return;
  }

  const toolbar = h("div", { class: "toolbar" });
  const tableWrap = h("div", { class: "table-scroll" });
  const pagination = h("div", { class: "pagination" });
  const detailArea = h("div");

  const searchInput = h("input", {
    type: "text",
    placeholder: "Search entry, response or error…",
    "aria-label": "Search trials",
    oninput: (event) => {
      explorer.search = event.target.value;
      explorer.page = 1;
      draw();
    },
  });
  const modelSelect = selectControl("Filter by model", [["all", "All models"],
    ...payload.models.map((name) => [name, name])], (value) => {
    explorer.model = value;
    explorer.page = 1;
    draw();
  });
  const outcomeSelect = selectControl("Filter by outcome", OUTCOME_FILTERS, (value) => {
    explorer.outcome = value;
    explorer.page = 1;
    draw();
  });
  const errorSelect = selectControl("Filter by error type", [["all", "All error types"],
    ...payload.errorTypes.map((name) => [name, name])], (value) => {
    explorer.errorType = value;
    explorer.page = 1;
    draw();
  });
  const pageSizeSelect = selectControl("Rows per page", [["25", "25 rows"], ["50", "50 rows"], ["100", "100 rows"]], (value) => {
    explorer.pageSize = Number(value);
    explorer.page = 1;
    draw();
  });

  toolbar.append(
    searchInput,
    modelSelect,
    outcomeSelect,
    errorSelect,
    pageSizeSelect,
  );
  section.append(toolbar, detailArea, tableWrap, pagination);

  function draw() {
    const filtered = trials.filter(trialMatches).sort(compareTrials);
    const pageCount = Math.max(1, Math.ceil(filtered.length / explorer.pageSize));
    explorer.page = Math.min(explorer.page, pageCount);
    const start = (explorer.page - 1) * explorer.pageSize;
    const pageRows = filtered.slice(start, start + explorer.pageSize);

    renderTrialTable(pageRows);
    pagination.replaceChildren(
      h("button", {
        type: "button",
        text: "Previous",
        disabled: explorer.page <= 1 ? "" : null,
        onclick: () => {
          explorer.page -= 1;
          draw();
        },
      }),
      h("span", { text: `Page ${explorer.page} of ${pageCount}` }),
      h("button", {
        type: "button",
        text: "Next",
        disabled: explorer.page >= pageCount ? "" : null,
        onclick: () => {
          explorer.page += 1;
          draw();
        },
      }),
      h("span", { class: "result-count", text: `${fmtInt(filtered.length)} of ${fmtInt(trials.length)} trials` }),
    );
  }

  function renderTrialTable(pageRows) {
    tableWrap.replaceChildren(
      h("table", { "aria-label": "Trial results" },
        h("thead", null, h("tr", null, TRIAL_COLUMNS.map(([key, label, sortable]) =>
          h("th", { class: key === "model" || key === "entryId" ? null : "num" },
            sortable
              ? h("button", {
                  type: "button",
                  onclick: () => {
                    if (explorer.sortKey === key) {
                      explorer.sortAsc = !explorer.sortAsc;
                    } else {
                      explorer.sortKey = key;
                      explorer.sortAsc = true;
                    }
                    draw();
                  },
                  text: sortLabel(key, label),
                })
              : label,
          ),
        ))),
        h("tbody", null, pageRows.map((trial) => renderTrialRow(trial))),
      ),
    );
  }

  function sortLabel(key, label) {
    const arrow = explorer.sortKey === key ? (explorer.sortAsc ? " ↑" : " ↓") : "";
    return label + arrow;
  }

  function renderTrialRow(trial) {
    const row = h("tr", {
      tabindex: "0",
      role: "button",
      "aria-label": `Trial ${trial.entryId}, model ${trial.model}, repeat ${trial.repeat}, ${trialOutcome(trial)}`,
      onclick: () => showTrialDetail(trial),
      onkeydown: (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          showTrialDetail(trial);
        }
      },
    },
      h("td", { class: "mono", text: trial.model }),
      h("td", { class: "mono", text: trial.entryId }),
      h("td", { class: "num", text: String(trial.repeat) }),
      h("td", null, h("span", { class: trial.ok ? "status-ok" : "status-failed", text: trial.ok ? "ok" : "failed" })),
      h("td", null, evaluationCell(trial)),
      h("td", { class: "num", text: fmtMs(generationLatency(trial)) }),
      h("td", { class: "num", text: fmtMs(trial.evaluationMs) }),
      h("td", { class: "num", text: fmtMs(trial.totalMs) }),
      h("td", { class: "num", text: fmtMs(trial.queueMs) }),
      h("td", { class: "num", text: fmtInt(trial.inputTokens) }),
      h("td", { class: "num", text: fmtInt(trial.outputTokens) }),
      h("td", { class: "num", text: fmtCost(trial.costUsd) }),
      h("td", { class: "mono", text: trial.errorType || "" }),
    );
    return row;
  }

  function evaluationCell(trial) {
    if (!trial.ok) return h("span", { class: "eval-na", text: "—" });
    if (trial.passed === true) return h("span", { class: "eval-pass", text: "pass" });
    if (trial.passed === false) return h("span", { class: "eval-fail", text: "fail" });
    return h("span", { class: "eval-na", text: "n/a" });
  }

  function showTrialDetail(trial) {
    const entry = datasetById ? datasetById[trial.entryId] : null;
    const detail = h("div", { class: "trial-detail" },
      h("header", null,
        h("h4", { text: `${trial.model} · ${trial.entryId} · repeat ${trial.repeat}` }),
        h("button", {
          type: "button",
          text: "Close",
          onclick: closeDetail,
        }),
      ),
      factRow("Status", trial.ok ? "ok" : "failed"),
      evaluationNodes(trial),
      factRow(
        legacyLatencyRun ? "Latency (legacy, includes evaluation)" : "Generation latency",
        fmtMs(generationLatency(trial)) + " ms",
      ),
      legacyLatencyRun
        ? null
        : factRow("Evaluation latency", fmtMs(trial.evaluationMs) + " ms"),
      legacyLatencyRun ? null : factRow("Total latency", fmtMs(trial.totalMs) + " ms"),
      factRow("Queue delay", fmtMs(trial.queueMs) + " ms"),
      factRow("Tokens", `in ${fmtInt(trial.inputTokens)} / out ${fmtInt(trial.outputTokens)}`),
      factRow("Estimated cost", fmtCost(trial.costUsd) + " USD"),
      trial.errorType ? factRow("Error type", trial.errorType) : null,
      h("p", { class: "field-label", text: "Response" }),
      h("pre", { text: trial.response === null ? "n/a" : trial.response }),
      trial.errorMessage ? h("p", { class: "field-label", text: "Error message" }) : null,
      trial.errorMessage ? h("pre", { text: trial.errorMessage }) : null,
      h("p", { class: "field-label", text: "Prompt" }),
      h("pre", { text: entry ? entry.prompt : "Not recorded in this export." }),
      h("p", { class: "field-label", text: "Reference" }),
      h("pre", { text: entry ? `${entry.reference} (${entry.metric})` : "Not recorded in this export." }),
      entry && entry.system ? h("p", { class: "field-label", text: "System prompt" }) : null,
      entry && entry.system ? h("pre", { text: entry.system }) : null,
    );
    detailArea.replaceChildren(detail);
    detail.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDetail();
    });
    detail.querySelector("button").focus();
  }

  function closeDetail() {
    detailArea.replaceChildren();
  }

  draw();
}

function factRow(label, value) {
  return h("div", null, h("span", { class: "field-label", text: label + ": " }), h("span", { class: "mono", text: value }));
}

function evaluationNodes(trial) {
  const evaluation = trial.evaluation;
  if (!evaluation) {
    return [factRow("Evaluation", trial.ok ? String(trial.passed) : "not evaluable")];
  }
  const nodes = [
    factRow("Evaluator", evaluation.evaluator),
    factRow("Evaluation status", evaluation.status),
  ];
  if (evaluation.score !== null && evaluation.score !== undefined) {
    nodes.push(factRow("Score", fmtScore(evaluation.score)));
  }
  if (evaluation.verdict) {
    nodes.push(factRow("Verdict", evaluation.verdict));
  }
  if (evaluation.error_message) {
    nodes.push(factRow("Evaluation error", truncate(evaluation.error_message, 200)));
  }
  const details = evaluation.details || {};

  if (evaluation.evaluator === "judge" && details.criteria) {
    nodes.push(h("p", { class: "field-label", text: "Judge criteria" }));
    nodes.push(
      h("table", { class: "criteria-table" },
        h("thead", null,
          h("tr", null,
            h("th", { text: "Criterion" }),
            h("th", { class: "num", text: "Mean" }),
            h("th", { class: "num", text: "Std" }),
            h("th", { class: "num", text: "Scale" }),
          ),
        ),
        h("tbody", null,
          Object.entries(details.criteria).map(([criterionId, values]) =>
            h("tr", null,
              h("td", { class: "mono", text: criterionId }),
              h("td", { class: "num", text: values.mean.toFixed(2) }),
              h("td", { class: "num", text: values.std === null ? "n/a" : values.std.toFixed(2) }),
              h("td", { class: "num mono", text: `${values.scale[0]} – ${values.scale[1]}` }),
            ),
          ),
        ),
      ),
    );
    if (details.reason) {
      nodes.push(h("p", { class: "field-label", text: "Judge reason" }));
      nodes.push(h("pre", { text: details.reason }));
    }
    nodes.push(factRow("Judgments", `${details.judgments} valid / ${details.judge_failures || 0} failed`));
  }

  if (evaluation.evaluator === "json_schema") {
    nodes.push(factRow("JSON valid", String(details.json_valid)));
    if (details.errors && details.errors.length > 0) {
      nodes.push(h("p", { class: "field-label", text: "Validation errors" }));
      nodes.push(h("pre", {
        text: details.errors.map((error) => `${error.path}: ${error.message}`).join("\n"),
      }));
    }
  }

  if (evaluation.evaluator === "code_tests") {
    if (details.overall && details.overall !== "completed") {
      nodes.push(factRow("Code outcome", details.overall));
    }
    if (details.submission_error) {
      nodes.push(h("p", { class: "field-label", text: "Submission error" }));
      nodes.push(h("pre", { text: details.submission_error }));
    }
    if (details.tests && details.tests.length > 0) {
      nodes.push(factRow("Tests", `${details.passed}/${details.total} passed`));
      nodes.push(h("pre", {
        text: details.tests
          .map((test) => `${test.status.padEnd(7)} ${test.name}${test.error ? ` — ${test.error}` : ""}`)
          .join("\n"),
      }));
    }
  }
  return nodes;
}

function selectControl(label, options, onChange) {
  const select = h("select", { "aria-label": label },
    options.map(([value, text]) =>
      h("option", { value, text }),
    ),
  );
  select.addEventListener("change", () => onChange(select.value));
  return select;
}

function renderErrors(section) {
  const modelsWithErrors = stats.filter((item) => Object.keys(item.errors || {}).length > 0);
  if (modelsWithErrors.length === 0) {
    section.append(h("p", { class: "empty-note", text: "No provider errors were recorded in this run." }));
    return;
  }

  const allTypes = [...new Set(modelsWithErrors.flatMap((item) => Object.keys(item.errors)))].sort();
  const typeColor = new Map(allTypes.map((name, index) => [name, colorForIndex(index)]));
  const maxErrors = Math.max(
    ...modelsWithErrors.map((item) => Object.values(item.errors).reduce((sum, count) => sum + count, 0)),
  );

  section.append(
    h("div", { class: "chart-rows" },
      h("div", { class: "legend" },
        allTypes.map((name) =>
          h("span", { class: "legend-item" },
            h("span", { class: "legend-swatch", style: `background:var(--${typeColor.get(name)})` }),
            name,
          ),
        ),
      ),
      modelsWithErrors.map((item) => {
        const total = Object.values(item.errors).reduce((sum, count) => sum + count, 0);
        return h("div", { class: "chart-row" },
          h("span", { class: "row-label", text: item.model }),
          h("div", { class: "track", role: "img", "aria-label": ariaForErrors(item) },
            allTypes.map((errorType) =>
              item.errors[errorType]
                ? h("div", {
                    class: "segment",
                    style: `width:${(item.errors[errorType] / maxErrors) * 100}%;background:var(--${typeColor.get(errorType)})`,
                    title: `${errorType}: ${item.errors[errorType]}`,
                  })
                : null,
            ),
          ),
          h("span", { class: "row-value", text: `${total} error${total === 1 ? "" : "s"}` }),
        );
      }),
    ),
    h("h3", { text: "Failed requests" }),
    failedRequestsTable(),
  );
}

function ariaForErrors(item) {
  return item.model + ": " + Object.entries(item.errors)

function judgeModelBlocks() {
  const byModel = new Map();
  for (const trial of judgeTrials) {
    if (!byModel.has(trial.model)) byModel.set(trial.model, []);
    byModel.get(trial.model).push(trial);
  }
  return [...byModel.entries()].map(([model, trialsForModel]) => {
    const completed = trialsForModel.filter(
      (trial) => trial.evaluation.status === "completed" && trial.evaluation.score !== null
    );
    const scores = completed.map((trial) => trial.evaluation.score);
    const criteria = {};
    for (const trial of completed) {
      const details = trial.evaluation.details || {};
      for (const [criterionId, values] of Object.entries(details.criteria || {})) {
        if (!criteria[criterionId]) criteria[criterionId] = { values: [], scale: values.scale };
        criteria[criterionId].values.push(values.mean);
      }
    }
    const knownCosts = trialsForModel
      .map((trial) => trial.evaluation.cost_usd)
      .filter((value) => value !== null && value !== undefined);
    const cost = knownCosts.length > 0
      ? knownCosts.reduce((total, value) => total + value, 0)
      : null;
    return { model, trialsForModel, completed, scores, criteria, cost, knownCosts };
  });
}

function renderJudgeScores(section) {
  if (judgeTrials.length === 0) {
    section.append(h("p", { class: "empty-note", text: "No judge evaluations in this run." }));
    return;
  }
  section.append(
    h("p", {
      class: "section-note",
      text: "Judge scores are subjective opinions of the configured judge model, normalized to " +
        "[0, 1] per criterion then weighted. They are kept separate from exact-match accuracy, " +
        "response length is not treated as a quality indicator, and they do not represent an " +
        "objective or universal measure of quality.",
    }),
    h("div", null, judgeModelBlocks().map((block) => judgeBlock(block))),
  );
}

function judgeBlock(block) {
  const costNote = block.cost === null
    ? ""
    : ` — judge cost ${block.cost.toFixed(6)} USD` +
      (block.knownCosts.length < block.trialsForModel.length
        ? ` (partial: known for ${block.knownCosts.length}/${block.trialsForModel.length} evaluations)`
        : "");
  const blockNode = h("div", { class: "multi-chart" },
    h("h4", { text: block.model }),
    h("p", {
      class: "sub",
      text: `${block.completed.length} judged response(s)` + costNote,
    }),
  );
  if (block.scores.length === 0) {
    blockNode.append(h("p", { class: "empty-note", text: "No completed judgment." }));
    return blockNode;
  }
  const mean = block.scores.reduce((sum, value) => sum + value, 0) / block.scores.length;
  const std = block.scores.length >= 2
    ? Math.sqrt(
        block.scores.reduce((sum, value) => sum + (value - mean) ** 2, 0) /
          (block.scores.length - 1),
      )
    : null;
  blockNode.append(
    h("p", { class: "sub", text: `overall ${mean.toFixed(3)}${std === null ? "" : ` ± ${std.toFixed(3)}`} (normalized)` }),
    scoreHistogram(block.scores),
    h("table", { class: "criteria-table" },
      h("thead", null,
        h("tr", null,
          h("th", { text: "Criterion" }),
          h("th", { class: "num", text: "Mean" }),
          h("th", { class: "num", text: "Std" }),
          h("th", { class: "num", text: "Scale" }),
        ),
      ),
      h("tbody", null,
        Object.entries(block.criteria).map(([criterionId, data]) => {
          const criterionMean = data.values.reduce((sum, value) => sum + value, 0) / data.values.length;
          const criterionStd = data.values.length >= 2
            ? Math.sqrt(
                data.values.reduce((sum, value) => sum + (value - criterionMean) ** 2, 0) /
                  (data.values.length - 1),
              )
            : null;
          return h("tr", null,
            h("td", { class: "mono", text: criterionId }),
            h("td", { class: "num", text: criterionMean.toFixed(2) }),
            h("td", { class: "num", text: criterionStd === null ? "n/a" : criterionStd.toFixed(2) }),
            h("td", { class: "num mono", text: `${data.scale[0]} – ${data.scale[1]}` }),
          );
        }),
      ),
    ),
  );
  return blockNode;
}

function scoreHistogram(values) {
  const bins = Array.from({ length: 10 }, () => 0);
  for (const value of values) {
    let index = Math.floor(value * 10);
    if (index >= 10) index = 9;
    bins[index] += 1;
  }
  const max = Math.max(...bins);
  return h("div", null,
    h("div", { class: "histogram", role: "img", "aria-label": "Judge score distribution" },
      bins.map((count, index) =>
        h("div", {
          class: "bin",
          tabindex: "0",
          style: `height:${Math.max(1, (count / max) * 100)}%`,
          title: `[${(index / 10).toFixed(1)}, ${((index + 1) / 10).toFixed(1)}): ${count} response(s)`,
        }),
      ),
    ),
    h("div", { class: "histogram-axis" },
      h("span", { text: "0.0" }),
      h("span", { text: "normalized judge score" }),
      h("span", { text: "1.0" }),
    ),
  );
}

function renderStructured(section) {
  const structured = trials.filter(
    (trial) => trial.evaluation && trial.evaluation.evaluator === "json_schema",
  );
  if (structured.length === 0) {
    section.append(h("p", { class: "empty-note", text: "No json_schema evaluations in this run." }));
    return;
  }
  const validCount = structured.filter(
    (trial) => trial.evaluation.details && trial.evaluation.details.json_valid,
  ).length;
  const passedCount = structured.filter((trial) => trial.evaluation.passed === true).length;

  const pathCounts = new Map();
  for (const trial of structured) {
    for (const error of (trial.evaluation.details || {}).errors || []) {
      pathCounts.set(error.path, (pathCounts.get(error.path) || 0) + 1);
    }
  }
  const topPaths = [...pathCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);

  const byModel = new Map();
  for (const trial of structured) {
    if (!byModel.has(trial.model)) byModel.set(trial.model, { total: 0, valid: 0, passed: 0 });
    const entry = byModel.get(trial.model);
    entry.total += 1;
    if (trial.evaluation.details && trial.evaluation.details.json_valid) entry.valid += 1;
    if (trial.evaluation.passed === true) entry.passed += 1;
  }

  section.append(
    h("div", { class: "table-scroll" },
      h("table", null,
        h("thead", null,
          h("tr", null,
            h("th", { text: "Model" }),
            h("th", { class: "num", text: "Responses" }),
            h("th", { class: "num", text: "Valid JSON" }),
            h("th", { class: "num", text: "Schema conformant" }),
          ),
        ),
        h("tbody", null,
          [...byModel.entries()].map(([model, entry]) =>
            h("tr", null,
              h("td", { class: "mono", text: model }),
              h("td", { class: "num", text: fmtInt(entry.total) }),
              h("td", { class: "num", text: `${fmtInt(entry.valid)} (${(entry.valid / entry.total * 100).toFixed(0)}%)` }),
              h("td", { class: "num", text: `${fmtInt(entry.passed)} (${(entry.passed / entry.total * 100).toFixed(0)}%)` }),
            ),
          ),
        ),
      ),
    ),
    h("p", {
      class: "section-note",
      text: `${validCount}/${structured.length} responses parsed as valid JSON; ` +
        `${passedCount}/${structured.length} conformed to their schema. Structural conformance ` +
        "does not mean the content is factually correct.",
    }),
    topPaths.length > 0
      ? h("div", { class: "table-scroll" },
          h("table", null,
            h("thead", null,
              h("tr", null,
                h("th", { text: "Invalid property" }),
                h("th", { class: "num", text: "Occurrences" }),
              ),
            ),
            h("tbody", null,
              topPaths.map(([path, count]) =>
                h("tr", null,
                  h("td", { class: "mono", text: path }),
                  h("td", { class: "num", text: String(count) }),
                ),
              ),
            ),
          ),
        )
      : null,
  );
}

function renderCodeEvaluation(section) {
  const codeTrials = trials.filter(
    (trial) => trial.evaluation && trial.evaluation.evaluator === "code_tests",
  );
  if (codeTrials.length === 0) {
    section.append(h("p", { class: "empty-note", text: "No code evaluations in this run." }));
    return;
  }
  const byModel = new Map();
  for (const trial of codeTrials) {
    if (!byModel.has(trial.model)) {
      byModel.set(trial.model, { total: 0, scores: [], timeouts: 0, submissionErrors: 0, unavailable: 0 });
    }
    const entry = byModel.get(trial.model);
    entry.total += 1;
    const evaluation = trial.evaluation;
    if (evaluation.status === "unavailable" || evaluation.status === "failed") {
      entry.unavailable += 1;
    } else if (evaluation.details && evaluation.details.overall === "timeout") {
      entry.timeouts += 1;
    } else if (evaluation.details && evaluation.details.overall === "submission_error") {
      entry.submissionErrors += 1;
    } else if (evaluation.score !== null && evaluation.score !== undefined) {
      entry.scores.push(evaluation.score);
    }
  }
  section.append(
    h("div", { class: "table-scroll" },
      h("table", null,
        h("thead", null,
          h("tr", null,
            ["Model", "Responses", "Mean test pass rate", "Timeouts", "Submission errors",
              "Infrastructure"].map((label, index) =>
              h("th", { class: index > 0 ? "num" : null, text: label }),
            ),
          ),
        ),
        h("tbody", null,
          [...byModel.entries()].map(([model, entry]) =>
            h("tr", null,
              h("td", { class: "mono", text: model }),
              h("td", { class: "num", text: fmtInt(entry.total) }),
              h("td", {
                class: "num",
                text: entry.scores.length === 0
                  ? "n/a"
                  : (entry.scores.reduce((sum, value) => sum + value, 0) / entry.scores.length * 100).toFixed(1) + "%",
              }),
              h("td", { class: "num", text: fmtInt(entry.timeouts) }),
              h("td", { class: "num", text: fmtInt(entry.submissionErrors) }),
              h("td", { class: "num", text: fmtInt(entry.unavailable) }),
            ),
          ),
        ),
      ),
    ),
    h("p", {
      class: "section-note",
      text: "Code was executed only inside a restricted container. Infrastructure failures and " +
        "unavailable runtimes are never counted as functional failures of the model.",
    }),
  );
}

function renderStatisticalAnalysis(section) {
  const data = payload.statistics;
  if (!data || data.length === 0) {
    section.append(h("p", { class: "empty-note", text: "No statistical analysis available." }));
    return;
  }
  const resampling = data[0].resampling || {};
  const metricLabels = {
    pass_rate: "pass rate (conditional on evaluation)",
    latency_ms: "generation latency (ms)",
    judge_score: "judge score",
  };
  const metricRows = [];
  for (const entry of data) {
    for (const metricKey of ["pass_rate", "latency_ms", "judge_score"]) {
      const metric = entry[metricKey];
      if (!metric || metric.summary.count === 0) continue;
      metricRows.push({ model: entry.model, metricKey, metric });
    }
  }
  section.append(
    h("div", { class: "table-scroll" },
      h("table", null,
        h("thead", null,
          h("tr", null,
            ["Model", "Metric", "Mean", "Median", "Std", "Min", "Max", "95% CI", "Units",
              "Excluded questions"].map(
              (label, index) => h("th", { class: index > 1 ? "num" : null, text: label }),
            ),
          ),
        ),
        h("tbody", null,
          metricRows.map(({ model, metricKey, metric }) => {
            const format = (value) =>
              value === null || value === undefined
                ? "n/a"
                : metricKey === "latency_ms" ? value.toFixed(1) : value.toFixed(3);
            const ci = metric.ci95.low === null || metric.ci95.low === undefined
              ? "n/a"
              : `[${format(metric.ci95.low)}, ${format(metric.ci95.high)}]`;
            const excluded = metric.excluded_questions
              ? (metric.excluded_questions.length === 0
                ? "0"
                : `${metric.excluded_questions.length}: ${metric.excluded_questions.join(", ")}`)
              : "n/a";
            return h("tr", null,
              h("td", { class: "mono", text: model }),
              h("td", { text: metricLabels[metricKey] || metricKey }),
              h("td", { class: "num", text: format(metric.summary.mean) }),
              h("td", { class: "num", text: format(metric.summary.median) }),
              h("td", { class: "num", text: format(metric.summary.std) }),
              h("td", { class: "num", text: format(metric.summary.min) }),
              h("td", { class: "num", text: format(metric.summary.max) }),
              h("td", { class: "num", text: ci }),
              h("td", { class: "num", text: fmtInt(metric.summary.count) }),
              h("td", { class: "num", title: excluded, text: excluded }),
            );
          }),
        ),
      ),
    ),
    h("p", {
      class: "section-note",
      text: `Bootstrap: percentile method, ${fmtInt(resampling.iterations)} iterations, ` +
        `${Math.round((resampling.confidence_level || 0.95) * 100)}% confidence, resampling unit: ` +
        `${resampling.unit}. Confidence intervals describe the observed data; overlapping or ` +
        "non-overlapping intervals are not a significance test between models.",
    }),
  );
}

const SECTIONS = [
  ["overview", "Overview", renderOverview],
  ["evaluation-overview", "Evaluation overview", renderEvaluationOverview],
  ["judge", "Judge scores", renderJudgeScores],
  ["structured", "Structured output", renderStructured],
  ["code-eval", "Code evaluation", renderCodeEvaluation],
  ["performance", "Model performance", renderPerformance],
  ["latency", "Latency", renderLatency],
  ["tokens-cost", "Tokens & cost", renderTokensCost],
  ["statistics", "Statistical analysis", renderStatisticalAnalysis],
  ["trials", "Trial explorer", renderTrials],
  ["errors", "Errors", renderErrors],
  ["metadata", "Run metadata", renderMetadata],
];

function buildPage() {
  const app = document.getElementById("app");
  const nav = document.getElementById("section-nav");
  for (const [id, title, render] of SECTIONS) {
    nav.append(h("a", { href: "#" + id, text: title }));
    const section = h("section", { id },
      h("h2", { text: title }),
    );
    app.append(section);
    render(section);
  }
}

function setupThemeToggle() {
  const root = document.documentElement;
  const button = document.getElementById("theme-toggle");
  const preferDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = preferDark ? "dark" : "light";
  const syncLabel = () => {
    button.textContent = root.dataset.theme === "dark" ? "Light theme" : "Dark theme";
  };
  button.addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    syncLabel();
  });
  syncLabel();
}

buildPage();
setupThemeToggle();

</script>
</body>
</html>
