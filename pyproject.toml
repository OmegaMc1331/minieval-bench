[project]
name = "minieval-bench"
version = "0.1.0"
description = "Lightweight framework for benchmarking and comparing language models."
readme = "README.md"
license = "MIT"
authors = [{ name = "OmegaMc1331" }]
requires-python = ">=3.12"
keywords = ["llm", "benchmark", "evaluation", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "litellm>=1.63",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
minieval-bench = "minieval_bench.cli:app"

[project.urls]
Repository = "https://github.com/OmegaMc1331/minieval-bench"
Issues = "https://github.com/OmegaMc1331/minieval-bench/issues"
Changelog = "https://github.com/OmegaMc1331/minieval-bench/releases"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minieval_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
